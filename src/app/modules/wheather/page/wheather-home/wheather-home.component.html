<div class="search">
  <form #form="ngForm" (ngSubmit)="onSubmit()">
    <input
      type="text"
      placeholder="Busca localização"
      name="city"
      [(ngModel)]="initialCityName">
    <fa-icon
      [icon]="searchIcon"
      class="search-icon"
      style="margin-left: 10px; cursor: pointer;"
      (click)="onSubmit()"></fa-icon>
  </form>
</div>

<app-weather-card *ngIf="weatherDatas" [weatherDatas]="weatherDatas"></app-weather-card>
